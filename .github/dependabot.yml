version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 20

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/examples/electron"
    schedule:
      interval: "weekly"
    ignore:
      # Electron 45's renderer hangs at startup on macOS CI runners:
      # https://github.com/electron/electron/issues/55368 (#2117)
      - dependency-name: "electron"
        versions: [">=45"]
