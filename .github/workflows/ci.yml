name: CI

on:
  push:
    branches:
      - main
      - "0.6"
      - "0.8.x"
      - v*
  pull_request:
  schedule:
    - cron: "23 8 * * 4" # Thursdays 08:23 UTC
  workflow_dispatch:

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: package.json
      - run: npm i
      - run: npm run lint

  test:
    strategy:
      matrix:
        os: [ubuntu-latest]
        node: [20, 22, 24, 26]
        include:
          - os: macos-latest
            node: 22
          - os: windows-latest
            node: 22
      fail-fast: true

    runs-on: ${{ matrix.os }}

    steps:
      - uses: browser-actions/setup-firefox@v1.7.2
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: "npm"
          cache-dependency-path: package.json
      - run: firefox --version
      - run: npm i
      - uses: nick-invision/retry@v4.0.0
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_on: error
          command: npm test
      - run: sudo apt-get install -y libgtk2.0-0
        if: runner.os == 'Linux'
      - name: npm run integration
        uses: GabrielBB/xvfb-action@v1.7
        with:
          run: npm run integration

  safari-smoke:
    name: safari-ci-smoke
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: package.json
      - run: npm i
      - run: npm run ci:safari-smoke

  legacy-phantomjs:
    name: legacy-phantomjs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # PhantomJS 2.1.1 reads the system OpenSSL config. Ubuntu 24's
    # openssl.cnf loads a providers module that the old binary cannot.
    env:
      OPENSSL_CONF: /dev/null

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: package.json
      - run: sudo apt-get install -y libfontconfig1
      - name: Install PhantomJS 2.1.1
        run: |
          curl -fsSL -o /tmp/phantomjs.tar.bz2 \
            https://github.com/Medium/phantomjs/releases/download/v2.1.1/phantomjs-2.1.1-linux-x86_64.tar.bz2
          echo "86dd9a4bf4aee45f1a84c9f61cf1947c1d6dce9b9e8d2a907105da7852460d2f  /tmp/phantomjs.tar.bz2" | sha256sum -c -
          tar -xjf /tmp/phantomjs.tar.bz2 -C /tmp
          sudo mv /tmp/phantomjs-2.1.1-linux-x86_64/bin/phantomjs /usr/local/bin/phantomjs
          phantomjs -v
      - run: npm i
      - run: npm run ci:legacy-phantomjs
        env:
          LEGACY_BROWSERS_REQUIRED: PhantomJS

  browser-tests:
    name: browser-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency: "sauce"

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: package.json
      - run: npm i
      - run: npm run browser-tests
        env:
          SAUCE_USERNAME: testem-ci
          SAUCE_ACCESS_KEY: 1f00979e-0252-4d69-98ff-f6c85d1a746b
      - run: npm run ci:legacy-ie
        env:
          SAUCE_USERNAME: testem-ci
          SAUCE_ACCESS_KEY: 1f00979e-0252-4d69-98ff-f6c85d1a746b
